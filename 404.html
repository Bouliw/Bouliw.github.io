<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>404 · Bouliw</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2318181b'/%3E%3Ctext x='16' y='23' font-family='Georgia,serif' font-size='20' text-anchor='middle' fill='%23f5f3ee'%3EB%3C/text%3E%3C/svg%3E">
<style>
/* Served by GitHub Pages for any missing path, at any depth: every URL here is absolute. */
@font-face { font-family: "FX Serif"; src: url("/fun/fonts/noto-serif-wdth.woff2") format("woff2"); font-weight: 100 900; font-stretch: 62.5% 100%; font-display: swap; }
@font-face { font-family: "FX Geist"; src: url("/fun/fonts/geist.woff2") format("woff2"); font-weight: 100 900; font-display: swap; }
@font-face { font-family: "FX Mono"; src: url("/fun/fonts/geist-mono.woff2") format("woff2"); font-weight: 100 900; font-display: swap; }
@font-face { font-family: "FX Press"; src: url("/fun/fonts/press-start-2p.woff2") format("woff2"); font-display: swap; }
:root { --ink: #0a0a0b; --bg: #f5f3ee; --v: #6b2bff; --a: #b6ff3b; --m: #ff2e88; }
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; display: flex; flex-direction: column; color: var(--ink); font: 17px/1.6 "FX Geist", -apple-system, system-ui, sans-serif; -webkit-font-smoothing: antialiased;
  background:
    radial-gradient(circle at 18% 22%, rgb(107 43 255 / .18), transparent 42%),
    radial-gradient(circle at 85% 80%, rgb(182 255 59 / .28), transparent 45%),
    radial-gradient(rgb(10 10 11 / .12) 1px, transparent 1.2px) 0 0 / 16px 16px,
    var(--bg);
}
a { color: inherit; }
a:focus-visible, button:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }
header { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 18px clamp(18px, 5vw, 56px); border-bottom: 1px solid rgb(107 43 255 / .35); }
.mark { display: inline-flex; align-items: center; gap: 10px; font: 700 13px/1 "FX Mono", monospace; letter-spacing: .28em; text-transform: uppercase; text-decoration: none; }
.mark b { display: grid; place-items: center; width: 30px; height: 30px; font: 700 18px/1 Georgia, serif; letter-spacing: 0; color: #fff; background: var(--v); box-shadow: 3px 3px 0 var(--a); }
.code { font: 600 11px/1 "FX Mono", monospace; letter-spacing: .2em; color: rgb(10 10 11 / .55); }
main { flex: 1; display: grid; place-items: center; padding: clamp(28px, 6vw, 72px) clamp(18px, 5vw, 56px) 48px; }
.card { position: relative; width: min(760px, 100%); }
.n { position: relative; display: inline-block; }
.num { position: relative; isolation: isolate; margin: 0; font: 900 clamp(7.5rem, 30vw, 17rem)/.8 "FX Serif", serif; font-stretch: 62.5%; letter-spacing: -.01em; }
.num::before, .num::after { content: "404"; position: absolute; inset: 0; pointer-events: none; }
.num::before { z-index: -1; color: var(--v); translate: .05em .05em; }
.num::after { z-index: -2; color: color-mix(in oklab, var(--a) 70%, #fff); translate: -.035em -.03em; }
/* The bug peeks over the top of the number, like on the portfolio. */
.peek { position: absolute; left: calc(var(--at, .5) * 100%); top: calc(clamp(7.5rem, 30vw, 17rem) * .07); width: 96px; height: 96px; translate: -50% -100%; overflow: hidden; }
.peek svg { display: block; width: 100%; height: 100%; translate: 0 58%; cursor: pointer; color: var(--m); filter: drop-shadow(0 0 1px #fff); transition: translate .25s cubic-bezier(.2, 1.3, .4, 1); animation: peek 5s ease-in-out infinite; }
.peek svg:hover { animation: none; translate: 0 28%; }
.peek .fb { opacity: 0; animation: fb 5s steps(1, end) infinite; }
.peek .fa { animation: fa 5s steps(1, end) infinite; }
@keyframes peek { 0%, 62%, 100% { translate: 0 58%; } 70%, 90% { translate: 0 44%; } }
@keyframes fa { 0% { opacity: 1; } 72% { opacity: 0; } 77% { opacity: 1; } 82% { opacity: 0; } 87% { opacity: 1; } }
@keyframes fb { 0% { opacity: 0; } 72% { opacity: 1; } 77% { opacity: 0; } 82% { opacity: 1; } 87% { opacity: 0; } }
.peek.got { overflow: visible; }
.peek.got svg { pointer-events: none; animation: got 1.1s cubic-bezier(.2, .9, .3, 1) forwards; }
.peek.got .fa { animation: none; }
.peek.got .fb { animation: fb .3s steps(1, end) infinite; }
@keyframes got { 0% { translate: 0 40%; } 30% { translate: 0 -40%; scale: 1.15; } 50% { translate: 0 -30%; scale: 1; opacity: 1; } 100% { translate: 220% -260%; rotate: 40deg; scale: .4; opacity: 0; } }
.say { position: absolute; left: calc(var(--at, .5) * 100%); top: -110px; z-index: 5; width: max-content; max-width: min(300px, 80vw); translate: -50% -100%; padding: 9px 11px; font: 10px/1.6 "FX Press", monospace; background: #fff; border: 2px solid var(--ink); box-shadow: 3px 3px 0 var(--ink); opacity: 0; pointer-events: none; transition: opacity .15s; }
.say.on { opacity: 1; }
h1 { margin: 28px 0 8px; font: 900 clamp(1.9rem, 5vw, 3.2rem)/1 "FX Serif", serif; font-stretch: 75%; text-transform: uppercase; }
h1 em { font-style: normal; color: transparent; background: linear-gradient(95deg, #5420d6, #d6006c 45%, #5420d6) 0 0 / 100% 100%; -webkit-background-clip: text; background-clip: text; }
p { max-width: 46ch; margin: 0 0 26px; }
.row { display: flex; flex-wrap: wrap; align-items: center; gap: 14px 22px; }
.btn { display: inline-block; padding: 14px 22px; font: 700 13px/1 "FX Mono", monospace; letter-spacing: .14em; text-transform: uppercase; text-decoration: none; background: var(--a); border: 2px solid var(--ink); box-shadow: 5px 5px 0 var(--v); transition: translate .12s, box-shadow .12s; }
.btn:hover { translate: -2px -2px; box-shadow: 7px 7px 0 var(--v); }
.btn:active { translate: 3px 3px; box-shadow: 2px 2px 0 var(--v); }
.more { font: 600 14px/1 "FX Mono", monospace; text-underline-offset: 4px; }
/* The buddy, arms crossed: nothing to do with it. */
.buddy { position: absolute; right: 0; bottom: -10px; display: flex; flex-direction: column; align-items: center; }
.buddy i { display: block; width: 72px; height: 117px; background: url("/fun/sprites/buddy.png") no-repeat 100% 0 / 864px 702px; image-rendering: pixelated; }
.buddy span { margin-bottom: 10px; padding: 7px 10px; font: 9px/1.3 "FX Press", monospace; white-space: nowrap; background: #fff; border: 2px solid var(--ink); box-shadow: 3px 3px 0 var(--ink); }
@media (max-width: 640px) { .buddy { display: none; } }
@media (prefers-reduced-motion: reduce) { .peek svg, .peek g { animation: none !important; transition: none; } }
</style>
</head>
<body>
<header>
  <a class="mark" href="/"><b aria-hidden="true">B</b>Bouliw</a>
  <span class="code" aria-hidden="true">ERR_PAGE_NOT_FOUND</span>
</header>
<main>
  <div class="card">
    <div class="n">
      <div class="num" aria-hidden="true">404</div>
      <span class="peek" aria-hidden="true"></span>
      <span class="say" aria-hidden="true"></span>
    </div>
    <h1 data-t="h1">You found <em>a real bug.</em></h1>
    <p data-t="p">This page doesn't exist, or it got squashed. The projects are all still on the portfolio.</p>
    <div class="row">
      <a class="btn" href="/" data-t="home">Back to the portfolio</a>
      <a class="more" href="https://github.com/Bouliw" data-t="gh">Projects on GitHub</a>
    </div>
    <div class="buddy" aria-hidden="true"><span data-t="buddy">Not me.</span><i></i></div>
  </div>
</main>
<script>
(() => {
  const FR = {
    h1: 'Tu as trouvé <em>un vrai bug.</em>',
    p: "Cette page n'existe pas, ou elle s'est fait écraser. Tous les projets sont toujours sur le portfolio.",
    home: 'Retour au portfolio', gh: 'Projets sur GitHub', buddy: "C'est pas moi.",
    caught: "Tu m'as trouvé ! La page, par contre…", title: '404 · Bouliw',
  };
  const EN = { caught: 'You found me! The page, not so much…' };
  let lang = null;
  try { lang = localStorage.getItem('bouliw-lang'); } catch (e) { /* storage blocked */ }
  if (lang !== 'fr' && lang !== 'en') lang = /^fr\b/i.test((navigator.languages && navigator.languages[0]) || navigator.language || '') ? 'fr' : 'en';
  const fr = lang === 'fr';
  if (fr) {
    document.documentElement.lang = 'fr';
    document.querySelectorAll('[data-t]').forEach(n => { n.innerHTML = FR[n.dataset.t]; });
  }
  // Same 16×16 bug as on the portfolio.
  const ART = [[
    '...k........k...', '....k......k....', '.....k....k.....', '....kkkkkkkk....',
    '...kkkkkkkkkk...', '..kkwwkkkkwwkk..', '..kkwkkkkkwkkk..', '..kkkkkkkkkkkk..',
    '...kkkkkkkkkk...', 'k.kbbsbbkbbbbk.k', '.kbbsbbbkbbkbbk.', 'kkbbbbbbkbbbbbkk',
    '.kbkbbbbkbbbbbk.', 'kkbbbbbbkbbbkbkk', '..kbbbbbkbbbbk..', '...kkkkkkkkkk...',
  ], [
    '..k..........k..', '...k........k...', '.....k....k.....', '....kkkkkkkk....',
    '...kkkkkkkkkk...', '..kkwwkkkkwwkk..', '..kkkwkkkkkwkk..', '..kkkkkkkkkkkk..',
    '...kkkkkkkkkk...', '..kbbsbbkbbbbk..', 'kkbbsbbbkbbkbbkk', '.kbbbbbbkbbbbbk.',
    'kkbkbbbbkbbbbbkk', '.kbbbbbbkbbbkbk.', 'k.kbbbbbkbbbbk.k', '...kkkkkkkkkk...',
  ]];
  const FILL = { k: '#0a0a0b', w: '#fff', b: 'currentColor', s: 'rgb(255 255 255 / .75)' };
  const frame = (rows, cls) => {
    let out = '';
    rows.forEach((row, y) => {
      for (let x = 0; x < row.length;) {
        const c = row[x];
        let w = 1;
        while (row[x + w] === c) w++;
        if (c !== '.') out += `<rect x="${x}" y="${y}" width="${w}" height="1" fill="${FILL[c]}"/>`;
        x += w;
      }
    });
    return `<g class="${cls}">${out}</g>`;
  };
  const peek = document.querySelector('.peek');
  const say = document.querySelector('.say');
  peek.innerHTML = `<svg viewBox="0 0 16 16" shape-rendering="crispEdges">${frame(ART[0], 'fa')}${frame(ART[1], 'fb')}</svg>`;
  peek.querySelector('svg').addEventListener('click', () => {
    if (peek.classList.contains('got')) return;
    say.textContent = fr ? FR.caught : EN.caught;
    say.classList.add('on');
    peek.classList.add('got');
    setTimeout(() => say.classList.remove('on'), 2800);
  });
})();
</script>
</body>
</html>
